[package]
name = "pulse"
version = "0.2.0"
description = "Pulse: what the Claude app's sessions and routines do, and what of it needs you"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
notify = "8"
rusty-leveldb = "3"
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_RestartManager", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
