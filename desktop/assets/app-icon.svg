<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Pulse, "Graphit & Neon": a heartbeat line from cyan to violet that ends in a glowing pink dot -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2c33"/><stop offset="1" stop-color="#111216"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#3fe0ff"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="lineglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <path d="M512 100c234 0 297 0 361 64s64 127 64 348 0 297-64 361-127 64-361 64-297 0-361-64-64-127-64-361 0-284 64-348S278 100 512 100z" fill="url(#bg)"/>
  <path d="M512 100c234 0 297 0 361 64s64 127 64 348 0 297-64 361-127 64-361 64-297 0-361-64-64-127-64-361 0-284 64-348S278 100 512 100z" fill="url(#sheen)"/>
  <path d="M215 545h140l52-130 78 262 70-332 62 200h95" fill="none" stroke="url(#line)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" opacity=".55" filter="url(#lineglow)"/>
  <path d="M215 545h140l52-130 78 262 70-332 62 200h95" fill="none" stroke="url(#line)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="770" cy="545" r="74" fill="#ff4f9a" filter="url(#glow)" opacity=".85"/>
  <circle cx="770" cy="545" r="52" fill="#ff4f9a"/>
</svg>
