    <linearGradient id="l-line" x1="0" x2="1"><stop offset="0" stop-color="#00b4e0"/><stop offset="1" stop-color="#7a3cf2"/></linearGradient>
    <filter id="l-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="l-lineglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
