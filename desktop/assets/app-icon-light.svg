  <path d="M512 100c234 0 297 0 361 64s64 127 64 348 0 297-64 361-127 64-361 64-297 0-361-64-64-127-64-361 0-284 64-348S278 100 512 100z" fill="url(#l-bg)" stroke="#000" stroke-opacity=".12" stroke-width="12"/>
