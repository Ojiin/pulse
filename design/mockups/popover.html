<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Radar Popover</title>
<script src="glyphs.js"></script>
<style>
  :root { --red: #e5484d; --amber: #f2a20c; --violet: #8e4ec6; --blue: #3e7bfa; --green: #30a46c; --ink: #1d1d1f; --mute: #6e6e73; --line: rgba(0,0,0,.08); --knock: #f7f7f7; --t: 0 }
  * { box-sizing: border-box }
  body { margin: 0; width: 560px; height: 1080px; font: 13px/1.35 -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink); overflow: hidden;
    background: radial-gradient(1200px 700px at 20% 110%, #c9b8a6, transparent), linear-gradient(160deg, #8fa3b8, #d9cbbb 60%, #b8a99a) }
  .menubar { height: 26px; background: rgba(246,246,246,.75); backdrop-filter: blur(20px); display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: 0 14px; font-size: 13px; font-weight: 500; --knock: #ececec }
  .tray { display: inline-flex; align-items: center; gap: 7px; background: rgba(0,0,0,.12); border-radius: 5px; padding: 2px 7px }
  .tray .chip { display: inline-flex; align-items: center; gap: 2px; color: var(--c); font-size: 12px; font-weight: 700 } .tray .sym { width: 15px !important; height: 15px !important }
  .pop { position: absolute; top: 34px; right: 46px; width: 410px; background: rgba(247,247,247,.9); backdrop-filter: blur(30px) saturate(1.6); border-radius: 14px;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 18px 50px rgba(0,0,0,.28); overflow: hidden }
  .pop.pinned { box-shadow: 0 0 0 1.5px rgba(10,99,216,.55), 0 18px 50px rgba(0,0,0,.28) }
  .sym { display: inline-block; color: var(--c); flex: none } .sym svg { width: 100%; height: 100%; display: block }
  .type { display: inline-block; width: 13px; height: 13px; color: #8e8e93; flex: none; vertical-align: -2px } .type svg { width: 100%; height: 100% }
  /* animations, frozen at --t seconds when rendered frame by frame */
  @keyframes spin { to { transform: rotate(360deg) } } @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1) } 50% { opacity: .35; transform: scale(.88) } }
  @keyframes grow { from { width: var(--from) } to { width: var(--to) } } @keyframes sheen { from { background-position: -120px 0 } to { background-position: 240px 0 } }
  @keyframes glow { 0%, 100% { box-shadow: inset 3px 0 0 var(--red) } 50% { box-shadow: inset 3px 0 0 rgba(229,72,77,.25) } }
  .spin { animation: spin 1.2s linear infinite } .pulse { animation: pulse 1.2s ease-in-out infinite }
  .frozen .spin, .frozen .pulse, .frozen .bar i, .frozen .bar i::after, .frozen .row.blk { animation-play-state: paused !important; animation-delay: calc(var(--t) * -1s) !important }
  .hdr { padding: 12px 14px 6px; display: grid; gap: 9px }
  .hdr .counts { display: flex; gap: 5px }
  .cnt { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px 3px 4px; border-radius: 99px; white-space: nowrap; font-size: 11.5px !important; background: color-mix(in srgb, var(--c) 12%, #fff); color: color-mix(in srgb, var(--c) 80%, #000); font-weight: 650; font-size: 12px; --knock: color-mix(in srgb, var(--c) 12%, #fff) }
  .cnt .sym { width: 15px; height: 15px }
  .tools { display: flex; gap: 4px } .tb { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: #48484a; background: rgba(0,0,0,.05) } .tb svg { width: 14px; height: 14px }
  .tb.on { background: #0a63d8; color: #fff }
  .usage { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; font-size: 11.5px; color: var(--mute); padding: 2px 2px 0 }
  .usage .track { height: 5px; background: rgba(0,0,0,.08); border-radius: 3px; overflow: hidden } .usage .track i { display: block; height: 100%; border-radius: 3px; background: var(--c, #8e8e93) }
  .usage b { color: #3a3a3c; font-weight: 600 } .usage .soon { color: #b5730a; font-weight: 600 }
  .segrow { display: flex; gap: 6px; margin: 4px 14px 8px; align-items: center } .seg { flex: 1; background: rgba(0,0,0,.06); border-radius: 8px; padding: 2px; display: grid; grid-template-columns: repeat(3, 1fr) }
  .seg div { text-align: center; padding: 4px 0; border-radius: 6px; font-size: 12px; font-weight: 500; color: #3a3a3c } .seg .on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12) }
  .seg small { color: var(--red); font-weight: 700; margin-left: 3px }
  .body { max-height: 800px; overflow: hidden }
  .sec { border-top: .5px solid var(--line) }
  .sh { display: flex; align-items: center; gap: 7px; padding: 8px 14px 5px; font-weight: 600; font-size: 12px; color: #3a3a3c }
  .sh .chev { width: 10px; color: #8e8e93; font-size: 9px } .sh .n { margin-left: auto; color: var(--mute); font-weight: 500 }
  .sh.old { background: color-mix(in srgb, var(--red) 9%, transparent); color: #a1262b }
  .row { display: grid; grid-template-columns: 18px 1fr auto; gap: 1px 9px; padding: 7px 14px 8px; align-items: start; position: relative }
  .row > .sym { margin-top: 1px } .row.hl { background: rgba(0,0,0,.05) }
  .row.blk { animation: glow 1.2s ease-in-out infinite; box-shadow: inset 3px 0 0 var(--red) }
  .row .t1 { display: flex; align-items: center; gap: 5px; min-width: 0 } .row b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .row .proj { color: #8e8e93; font-size: 11.5px; white-space: nowrap }
  .row p { grid-column: 2 / 4; margin: 0; color: #48484a; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .age { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--mute); white-space: nowrap; padding: 1px 6px; border-radius: 5px; align-self: center }
  .age.warn { background: #fdf0d5; color: #8a5a00 } .age.alarm { background: var(--red); color: #fff; font-weight: 600 }
  .acts { grid-column: 2 / 4; display: flex; gap: 6px; margin-top: 6px }
  .btn { border-radius: 6px; padding: 3px 9px; font-size: 11.5px; background: rgba(0,0,0,.07); color: var(--ink) } .btn.p { background: #0a63d8; color: #fff }
  .collapsed { padding: 8px 14px; display: flex; gap: 7px; align-items: center; color: #3a3a3c; font-weight: 600; font-size: 12px }
  .collapsed .chev { color: #8e8e93; font-size: 9px; width: 10px } .collapsed .n { margin-left: auto; color: var(--mute); font-weight: 400; font-size: 11.5px }
  .proj-h { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-weight: 650; font-size: 13px }
  .proj-h .folder { width: 15px; height: 15px; color: #6aa0e8 } .proj-h .folder svg { width: 100%; height: 100% }
  .proj-h .chev { width: 10px; color: #8e8e93; font-size: 9px } .proj-h .mini { margin-left: auto; display: flex; gap: 8px }
  .mini span { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 700; color: var(--c) } .mini .sym { width: 14px !important; height: 14px !important }
  .sub { padding-left: 20px }
  .lbl { padding: 6px 14px 2px 34px; font-size: 10.5px; font-weight: 600; color: #8e8e93; letter-spacing: .04em; text-transform: uppercase }
  .live { grid-column: 2 / 4; font: 11px ui-monospace, SFMono-Regular, monospace; color: #3e5f9e; display: flex; justify-content: space-between; gap: 10px; margin-top: 2px; white-space: nowrap }
  .agents { grid-column: 2 / 4; margin-top: 6px; display: grid; gap: 4px }
  .ag { display: grid; grid-template-columns: 14px 128px 1fr 34px; gap: 6px; align-items: center; font-size: 11.5px; color: #48484a }
  .ag .sym { width: 13px !important; height: 13px !important } .ag span.n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .ag .tm { font: 10.5px ui-monospace, monospace; color: var(--mute); text-align: right }
  .bar { position: relative; height: 6px; background: rgba(0,0,0,.05); border-radius: 3px }
  .bar i { position: absolute; top: 0; bottom: 0; left: var(--x); width: var(--w); border-radius: 3px; background: var(--green) }
  .bar i.run { background: var(--blue); animation: grow 2.4s linear infinite; overflow: hidden }
  .bar i.run::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent) no-repeat; background-size: 60px 100%; animation: sheen 1.2s linear infinite }
  .tl { position: relative; padding: 0 14px 0 14px }
  .tl .day { padding: 9px 0 4px; font-size: 10.5px; font-weight: 600; color: #8e8e93; letter-spacing: .04em; text-transform: uppercase }
  .ev { display: grid; grid-template-columns: 42px 18px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; position: relative }
  .ev .h { font: 11.5px ui-monospace, SFMono-Regular, monospace; color: var(--mute); text-align: right }
  .ev b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis } .ev .r { font-size: 11.5px; color: var(--mute); white-space: nowrap }
  .ev .t1 { display: flex; gap: 5px; align-items: center; min-width: 0 }
  .ev.past b { font-weight: 500; color: #3a3a3c } .ev.future b { font-weight: 500; color: #48484a }
  .ev.dim { opacity: .65 }
  .now { display: grid; grid-template-columns: 42px 1fr; gap: 8px; align-items: center; margin: 4px 0; color: var(--red); font: 600 11px ui-monospace, monospace }
  .now::after { content: ''; height: 1.5px; background: var(--red); border-radius: 1px }
  .now span { text-align: right }
  .foot { border-top: .5px solid var(--line); padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--mute); background: rgba(255,255,255,.45) }
  .foot b { color: #0a63d8; font-weight: 500 }
  .cap { position: absolute; left: 22px; bottom: 18px; width: 516px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.45) }
  .cap h2 { margin: 0 0 4px; font-size: 17px } .cap div { font-size: 12.5px; opacity: .97; line-height: 1.45 }
  .nocap .cap { display: none }
</style></head>
<body>
<div class="menubar"><span class="tray" id="tray"></span><span>Do. 29. Okt. 15:42</span></div>
<div class="pop" id="pop">
  <div class="hdr">
    <div class="counts" id="counts"></div>
    <div class="usage">
      <span>5 h</span><span class="track"><i style="width:68%;--c:#f2a20c"></i></span><span><b>68 %</b> · <span class="soon">Reset in 1 h 18 min</span></span>
      <span>Woche</span><span class="track"><i style="width:31%"></i></span><span><b>31 %</b> · Reset Mo. 09:00</span>
    </div>
  </div>
  <div class="segrow"><div class="seg" id="seg"></div><div class="tools"><span class="tb" id="pinbtn"></span><span class="tb" id="extbtn"></span></div></div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<div class="cap" id="cap"></div>
<script>
const q = new URLSearchParams(location.search)
const tab = q.get('tab') || 'offen'
if (q.has('t')) { document.body.classList.add('frozen'); document.documentElement.style.setProperty('--t', q.get('t')) }
if (q.has('nocap')) document.body.classList.add('nocap')
const pinned = tab === 'projekte'
const $ = (s, h) => { document.querySelector(s).innerHTML = h }
$('#extbtn', G.external)
$('#pinbtn', pinned ? G.pin : G.pinOff); if (pinned) { document.querySelector('#pinbtn').classList.add('on'); document.querySelector('#pop').classList.add('pinned') }
const chip = (id, n) => `<span class="chip" style="--c:${COLOR[id]}">${sym(id, 15)}${n ?? ''}</span>`
$('#tray', chip('blocked', 1) + chip('waiting', 3) + chip('review', 2) + chip('running', ''))
$('#counts', [['blocked', '1 blockiert'], ['waiting', '3 Rückfragen'], ['review', '2 ansehen'], ['running', '2 laufen']].map(([id, l]) => `<span class="cnt" style="--c:${COLOR[id]}">${sym(id, 15)}${l}</span>`).join(''))
$('#seg', ['Offen<small>6</small>', 'Projekte', 'Zeitachse'].map((l, i) => `<div class="${['offen', 'projekte', 'zeitachse'][i] === tab ? 'on' : ''}">${l}</div>`).join(''))

const age = (txt, lvl = '') => `<span class="age ${lvl}">${txt}</span>`
const row = ({ s, tp, title, proj, a, lvl, p, hl, acts, blk }) => `<div class="row ${hl ? 'hl' : ''} ${blk ? 'blk' : ''}">${sym(s)}<span class="t1">${type(tp)}<b>${title}</b><span class="proj">${proj}</span></span>${age(a, lvl)}<p>${p}</p>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`
const ACTS = '<span class="btn p">In Claude öffnen</span><span class="btn">Gesehen</span><span class="btn">Erledigt</span>'
const sec = (title, n, inner, cls = '') => `<div class="sec"><div class="sh ${cls}"><span class="chev">▼</span>${title}<span class="n">${n}</span></div>${inner}</div>`
const folded = (title, n, symId) => `<div class="sec"><div class="collapsed"><span class="chev">▶</span>${symId ? sym(symId, 14) : ''}${title}<span class="n">${n}</span></div></div>`

if (tab === 'offen') {
  $('#body',
    sec('Liegt seit über 24 h', '2', [
      row({ s: 'waiting', tp: 'oneoff', title: 'Feed-Import nachholen', proj: 'shop-web', a: 'seit 5 Tagen', lvl: 'alarm', p: 'Wartet auf deine Entscheidung, ob die 61 Artikel aus dem Feed fallen.' }),
      row({ s: 'review', tp: 'chat', title: 'Paywall: Vorschlag', proj: 'shop-api', a: 'seit 2 Tagen', lvl: 'alarm', p: 'Fertig: drei Wege, wieder an die Lieferanten-Daten zu kommen. Nie angesehen.' }),
    ].join(''), 'old') +
    sec('Blockiert', '1', row({ s: 'blocked', tp: 'recurring', title: 'Täglicher Backup-Check', proj: 'shop-web', a: 'seit 5 h', lvl: 'warn', p: 'Freigabe für den Restore-Test abgelehnt; drei Bereiche ohne Ergebnis.', hl: true, acts: ACTS, blk: true })) +
    sec('Rückfrage', '2', [
      row({ s: 'waiting', tp: 'recurring', title: 'Preis-Watch', proj: 'shop-api', a: 'seit 4 h', lvl: 'warn', p: 'Soll ein neuer Anbieter in die Preisliste aufgenommen werden?' }),
      row({ s: 'waiting', tp: 'recurring', title: 'Newsletter-Digest', proj: 'travel-blog', a: 'seit 7 h', lvl: 'warn', p: '2 Antwortvorschläge und ein Hinweis zum Herbst-Post zur Prüfung.' }),
    ].join('')) +
    sec('Ergebnis ansehen', '2', [
      row({ s: 'review', tp: 'chat', title: 'Radar als Desktop-App', proj: 'claude-dashboard', a: 'seit 20 min', p: 'Umbau fertig, App liegt unter /Applications/Radar.app.' }),
      row({ s: 'review', tp: 'recurring', title: 'Link-Check morgens', proj: 'shop-web', a: 'seit 7 h', lvl: 'warn', p: '24 Links geprüft, 2 kaputt, Ping gesendet.' }),
    ].join('')) +
    folded('Nachverfolgen', '3 · gesehen, nicht abgeschlossen', 'follow'))
  $('#foot', '<span>Erledigt heute: 7</span><b>Alles erledigt anzeigen</b>')
  $('#cap', '<h2>Tab „Offen“</h2><div>Was dich braucht, nach Dringlichkeit. Ganz oben, was seit über 24 h liegt (rot); ab 2 h wird das Alter gelb. Blockiertes pulsiert. Typ-Symbol vor dem Titel: ↻ Routine, ▦ einmaliger Termin, › Chat. „Gesehen“ schiebt nach „Nachverfolgen“, „Erledigt“ schließt.</div>')
}

if (tab === 'projekte') {
  const ag = (s, n, x, w, tm, run) => `<div class="ag">${sym(s, 13)}<span class="n">${n}</span><span class="bar"><i class="${run ? 'run' : ''}" style="--x:${x}%;--w:${w}%;--from:${w - 12}%;--to:${w}%"></i></span><span class="tm">${tm}</span></div>`
  const proj = (name, mini, open, inner) => `<div class="sec"><div class="proj-h"><span class="chev">${open ? '▼' : '▶'}</span><span class="folder">${G.folder}</span>${name}<span class="mini">${mini.map(([id, n]) => `<span style="--c:${COLOR[id]}">${sym(id, 14)}${n}</span>`).join('')}</span></div>${open ? inner : ''}</div>`
  $('#body',
    proj('claude-dashboard', [['running', ''], ['review', 1]], true,
      `<div class="lbl">Läuft</div>` +
      `<div class="row sub">${sym('running')}<span class="t1">${type('chat')}<b>Radar: Oberfläche entwerfen</b></span>${age('12:44')}
        <div class="live"><span>▸ Write · popover.html</span><span>14 Werkzeuge · 0 Fehler</span></div>
        <div class="agents">${ag('done', 'Explore: Nutzungsdaten', 0, 34, '0:51')}${ag('done', 'Icons rendern', 22, 30, '0:38')}${ag('running', 'Mockups prüfen', 58, 36, '1:20', true)}</div></div>` +
      `<div class="lbl">Offen</div>` + row({ s: 'review', tp: 'chat', title: 'Radar als Desktop-App', proj: '', a: 'seit 20 min', p: 'Umbau fertig, App liegt unter /Applications/Radar.app.' }).replace('class="row', 'class="row sub')) +
    proj('shop-web', [['blocked', 1], ['review', 1], ['running', '']], true,
      `<div class="lbl">Läuft</div>` +
      `<div class="row sub">${sym('running')}<span class="t1">${type('recurring')}<b>Kommentare auswerten</b></span>${age('0:37')}<div class="live"><span>▸ Bash · curl review-api/runs</span><span>6 Werkzeuge</span></div></div>` +
      `<div class="lbl">Offen</div>` +
      row({ s: 'blocked', tp: 'recurring', title: 'Täglicher Backup-Check', proj: '', a: 'seit 5 h', lvl: 'warn', p: 'Freigabe für den Restore-Test abgelehnt.', blk: true }).replace('class="row', 'class="row sub') +
      row({ s: 'review', tp: 'recurring', title: 'Link-Check morgens', proj: '', a: 'seit 7 h', lvl: 'warn', p: '24 Links geprüft, 2 kaputt.' }).replace('class="row', 'class="row sub') +
      `<div class="collapsed sub"><span class="chev">▶</span>${sym('follow', 14)}Nachverfolgen<span class="n">1</span></div>` +
      `<div class="collapsed sub"><span class="chev">▶</span>${sym('planned', 14)}Geplant<span class="n">Reviews 16:05 · VACUUM 20:45 · +4</span></div>` +
      `<div class="collapsed sub"><span class="chev">▶</span>${sym('done', 14)}Erledigt heute<span class="n">9</span></div>`) +
    proj('shop-api', [['waiting', 2], ['review', 1], ['planned', 3]], false) +
    proj('travel-blog', [['waiting', 1]], false) +
    proj('shop-reports', [['done', '']], false))
  $('#foot', '<span>Angeheftet: bleibt offen, bis du schließt</span><b>Lösen</b>')
  $('#cap', '<h2>Tab „Projekte“ (angeheftet)</h2><div>Verzeichnis → Vorgang → Subagents. Der Projektkopf zeigt die Zustände als Symbole mit Zahl. Laufendes zeigt Laufzeit, aktuelles Werkzeug und die Subagents als Zeitbalken (blau = läuft, grün = fertig). Angeheftet: blauer Rand, Pin-Knopf aktiv.</div>')
}

if (tab === 'zeitachse') {
  const ev = (h, s, tp, title, r, cls = '') => `<div class="ev ${cls}"><span class="h">${h}</span>${sym(s, 15)}<span class="t1">${type(tp)}<b>${title}</b></span><span class="r">${r}</span></div>`
  $('#body', `<div class="tl">
    <div class="day">Heute</div>
    ${ev('08:30', 'review', 'recurring', 'Link-Check morgens', 'Ergebnis ansehen', 'past')}
    ${ev('08:31', 'waiting', 'recurring', 'Newsletter-Digest', 'Rückfrage', 'past')}
    ${ev('09:05', 'done', 'recurring', 'Kommentare auswerten ×6', 'nichts zu tun', 'past dim')}
    ${ev('10:15', 'blocked', 'recurring', 'Täglicher Backup-Check', 'blockiert', 'past')}
    ${ev('10:15', 'done', 'recurring', 'Uptime-Bericht', 'erledigt', 'past')}
    ${ev('11:30', 'waiting', 'recurring', 'Preis-Watch', 'Rückfrage', 'past')}
    ${ev('13:10', 'review', 'chat', 'Radar als Desktop-App', 'Ergebnis ansehen', 'past')}
    ${ev('14:58', 'running', 'chat', 'Radar: Oberfläche entwerfen', 'läuft 0:44')}
    ${ev('15:05', 'running', 'recurring', 'Kommentare auswerten', 'läuft 0:37')}
    <div class="now"><span>15:42</span></div>
    ${ev('16:05', 'planned', 'recurring', 'Kommentare auswerten', 'in 23 min', 'future')}
    ${ev('20:45', 'planned', 'oneoff', 'Datenbank aufräumen', 'in 5 h', 'future')}
    <div class="day">Morgen, Fr. 30.</div>
    ${ev('08:30', 'planned', 'recurring', 'Link-Check morgens', '', 'future')}
    ${ev('08:30', 'planned', 'recurring', 'Newsletter-Digest', '', 'future')}
    ${ev('10:00', 'planned', 'oneoff', 'Zertifikat erneuern', 'einmalig', 'future')}
    ${ev('10:15', 'planned', 'recurring', 'Täglicher Backup-Check', '', 'future')}
    ${ev('10:15', 'planned', 'recurring', 'Uptime-Bericht', '', 'future')}
    <div class="day">Ausgefallen</div>
    ${ev('11:00', 'missed', 'recurring', 'Bilder-Run wöchentlich · Mo.', 'Mac war aus', 'past')}
  </div>`)
  $('#foot', '<span>Nächste 7 Tage: 23 Läufe, 4 einmalige Prüfungen</span><b>Mehr anzeigen</b>')
  $('#cap', '<h2>Tab „Zeitachse“</h2><div>Vergangenheit, jetzt und Zukunft in einer Liste, Routinen und Chats gemischt. Leerläufe werden zusammengefasst (×6). Die rote Linie ist jetzt. Darunter, was als Nächstes kommt, mit einmaligen Prüfterminen (▦), und was ausgefallen ist.</div>')
}
</script>
</body></html>
