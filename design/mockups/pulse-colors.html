<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Pulse-Farben</title>
<style>
  body { margin: 0; width: 1240px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; background: #f2f1ee; color: #1d1d1f; padding: 34px 40px; box-sizing: border-box }
  h1 { font-size: 22px; margin: 0 0 4px } .sub { color: #6e6e73; margin-bottom: 24px }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px }
  .card { background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.06) }
  .card h2 { margin: 0; font-size: 15px } .card p { margin: 3px 0 10px; color: #6e6e73; font-size: 12.5px }
  .big { display: flex; justify-content: center; padding: 6px 0 14px } .big svg { width: 200px; height: 200px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.18)) }
  .small { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
  .dock { border-radius: 12px; padding: 8px; display: flex; gap: 10px; align-items: center; justify-content: center }
  .dock.l { background: rgba(230,230,232,.9) } .dock.d { background: #2a2a2d }
  .dock svg { width: 50px; height: 50px } .dock i { width: 42px; height: 42px; border-radius: 10px; opacity: .25; background: #999 }
  .noti { grid-column: 1 / 3; display: flex; gap: 10px; align-items: center; background: #eeeeef; border-radius: 12px; padding: 8px 10px; font-size: 12px }
  .noti svg { width: 34px; height: 34px; flex: none } .noti b { display: block } .noti span { color: #555 }
  .rec { display: inline-block; background: #1d1d1f; color: #fff; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 2px }
</style></head>
<body>
<h1>Pulse: sechs Farbstellungen</h1>
<div class="sub">Gleiche Form, andere Farben. Hintergrund als Verlauf, die Linie weiß oder selbst im Verlauf, der Punkt am Ende leuchtet.</div>
<div class="grid" id="grid"></div>
<script>
const sq = 'M512 40c260 0 330 0 401 71s71 141 71 401 0 330-71 401-141 71-401 71-330 0-401-71S40 772 40 512s0-330 71-401S252 40 512 40z'
const line = 'M150 560h170l60-150 90 300 80-380 70 230h110'
// name, description, background stops, line (colour or two stops), dot, recommended
const variants = [
  ['Mitternacht & Koralle', 'Tiefes Indigo bis Violett, weiße Linie, korallroter Punkt. Ruhig, edel, der Punkt springt ins Auge.', ['#3b2f8f', '#1a1440'], '#ffffff', '#ff6b6b', true],
  ['Aurora', 'Türkis bis Blau, weiße Linie, warmer Bernstein-Punkt. Frisch und freundlich.', ['#13b5a6', '#1e4fd6'], '#ffffff', '#ffc24a', false],
  ['Abendrot', 'Orange über Pink bis Lila, weiße Linie und weißer, leuchtender Punkt. Am wärmsten und auffälligsten.', ['#ff8a3d', '#e2367f', '#6a2bbd'], '#ffffff', '#ffffff', false],
  ['Graphit & Neon', 'Fast schwarz, die Linie selbst im Verlauf von Cyan zu Violett, pinker Punkt. Wirkt technisch, passt zum dunklen Modus.', ['#2a2c33', '#111216'], ['#3fe0ff', '#9b5cff'], '#ff4f9a', false],
  ['Smaragd', 'Grün bis Petrol, weiße Linie, gelber Punkt. Steht für „alles im grünen Bereich“.', ['#21b26b', '#0c5c62'], '#ffffff', '#ffe066', false],
  ['Papier', 'Hell und warm, dunkle Linie, korallroter Punkt. Passt zum hellen Modus und zum alten Papier-Look.', ['#fffdf8', '#ebe5d8'], '#2b2a33', '#ff5a5f', false],
]
const icon = ([name, , bg, ln, dot], id) => {
  const stops = bg.map((c, i) => `<stop offset="${i / (bg.length - 1)}" stop-color="${c}"/>`).join('')
  const lineGrad = Array.isArray(ln) ? `<linearGradient id="${id}l" x1="0" x2="1"><stop offset="0" stop-color="${ln[0]}"/><stop offset="1" stop-color="${ln[1]}"/></linearGradient>` : ''
  return `<svg viewBox="0 0 1024 1024"><defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient>${lineGrad}
    <filter id="${id}f" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="30"/></filter>
    <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <path d="${sq}" fill="url(#${id}g)"/><path d="${sq}" fill="url(#${id}s)"/>
    <path d="${line}" fill="none" stroke="${Array.isArray(ln) ? `url(#${id}l)` : ln}" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="790" cy="560" r="84" fill="${dot}" filter="url(#${id}f)" opacity=".85"/><circle cx="790" cy="560" r="60" fill="${dot}"/></svg>`
}
document.querySelector('#grid').innerHTML = variants.map((v, i) => `<div class="card"><h2>${String.fromCharCode(65 + i)} · ${v[0]}${v[5] ? '<span class="rec">Empfehlung</span>' : ''}</h2><p>${v[1]}</p>
  <div class="big">${icon(v, 'v' + i + 'a')}</div>
  <div class="small"><div class="dock l"><i></i>${icon(v, 'v' + i + 'b')}<i></i></div><div class="dock d"><i></i>${icon(v, 'v' + i + 'c')}<i></i></div>
  <div class="noti">${icon(v, 'v' + i + 'd')}<div><b>Pulse</b><span>Blockiert: Täglicher Backup-Check</span></div></div></div></div>`).join('')
</script>
</body></html>
