# A tag "v…" builds Pulse for Apple silicon and Intel in one app, as a disk
# image and as a packed app, and for Windows, as an installer, and puts them on
# a draft release of that tag. Neither is signed with a developer certificate
# (see the README).
# Started by hand, it builds a tag that is already there.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and release, such as v0.2.0
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the toolchain pinned in rust-toolchain.toml, for both kinds of Mac
      - name: Rust
        working-directory: desktop/src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Packages
        working-directory: desktop
        run: npm run setup
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --target universal-apple-darwin --bundles app,dmg
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Pulse ${{ inputs.tag || github.ref_name }}
          releaseBody: See the README for how to install the plugin and open the unsigned app.
          releaseDraft: true

  # the same tag for Windows: an installer (NSIS) on the same draft release
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Packages
        working-directory: desktop
        run: npm run setup
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --bundles nsis
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Pulse ${{ inputs.tag || github.ref_name }}
          releaseBody: See the README for how to install the plugin and open the unsigned app.
          releaseDraft: true
