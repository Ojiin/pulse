# A tag "v…" builds Pulse for Apple silicon and Intel in one app and puts it,
# as a disk image and as a packed app, on a draft release of that tag. The app
# is signed ad hoc only, not with a developer certificate (see the README).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the toolchain pinned in rust-toolchain.toml, for both kinds of Mac
      - name: Rust
        working-directory: desktop/src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Packages
        working-directory: desktop
        run: npm run setup
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --target universal-apple-darwin --bundles app,dmg
          tagName: ${{ github.ref_name }}
          releaseName: Pulse ${{ github.ref_name }}
          releaseBody: See the README for how to install the plugin and open the unsigned app.
          releaseDraft: true
